# The following is the order of the links in the header of the website.
#
# Changing the order here will adjust the order and you can also add additional
# links. Removing a link prevents it from showing in the header, but does not
# prevent it from being included in the site.
#
# `main` is used on Spanish pages (site root); `main_en` is used on pages under /en/.
# Portfolio, Blog Posts and Guide are not translated yet, so both lists point at the
# same (untranslated) URL for those.

main:
  - title: "Publicaciones"
    url: /publications/

  - title: "Portafolio"
    url: /portfolio/

  - title: "Blog"
    url: /year-archive/

  - title: "CV"
    url: /cv/

  - title: "Guía"
    url: /markdown/

main_en:
  - title: "Publications"
    url: /en/publications/

  - title: "Portfolio"
    url: /portfolio/

  - title: "Blog Posts"
    url: /year-archive/

  - title: "CV"
    url: /en/cv/

  - title: "Guide"
    url: /markdown/
